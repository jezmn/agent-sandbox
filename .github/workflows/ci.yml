name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Bubblewrap
        run: |
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap apparmor-utils shellcheck

      - name: Allow Bubblewrap user namespaces
        run: |
            sudo tee /etc/apparmor.d/agent-sandbox-bwrap >/dev/null <<'EOF'
            abi <abi/4.0>,
            include <tunables/global>
            profile agent-sandbox-bwrap /usr/bin/bwrap flags=(unconfined) {
              userns,
            }
            EOF
            sudo apparmor_parser -r /etc/apparmor.d/agent-sandbox-bwrap

      - name: Install shfmt
        run: |
            curl -sSLo /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
            chmod +x /tmp/shfmt
            sudo mv /tmp/shfmt /usr/local/bin/shfmt

      - name: Check syntax and help
        run: |
            shellcheck agent-sandbox tests/*.sh
            shfmt -i 4 -d agent-sandbox tests/*.sh
            bash -n agent-sandbox
            ./agent-sandbox --help

      - name: Check wrapper argument handling
        run: bash tests/launcher.sh

      - name: Check actual mounts
        run: bash tests/mounts.sh
